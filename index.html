<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#25083e">
  <meta name="description" content="Swanton Wrestling Club: practices, tournaments, team, announcements and club documents.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Swanton Wrestling">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Swanton Wrestling Club</title>
</head>
<body>
  <div id="app"><div class="initial-loading">Loading your wrestling club dashboard…</div></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="document-upload" class="sr-only" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.doc,.docx,.xls,.xlsx" multiple>
  <input id="sheet-import" class="sr-only" type="file" accept=".csv,text/csv">
  <input id="data-import" class="sr-only" type="file" accept=".json,application/json">
  <script src="app.js" defer></script>
</body>
</html>
